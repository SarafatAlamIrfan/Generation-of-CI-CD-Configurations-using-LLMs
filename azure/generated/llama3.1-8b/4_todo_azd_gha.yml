name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Install Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Log in with Azure (Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          pwsh -command "azd auth login --client-id $AZURE_CLIENT_ID --federated-credential-provider 'github' --tenant-id $AZURE_TENANT_ID"

      - name: Log in with Azure (Client Credentials)
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        run: |
          $credentials = ConvertFrom-Json -InputObject $AZURE_CREDENTIALS
          $maskedCredentials = $credentials | ForEach-Object { $_.Value = [System.Security.Cryptography.ProtectedData]::Protect([System.Text.Encoding]::UTF8.GetBytes($_.Value), [System.Security.Cryptography.DataProtectionScope]::CurrentUser); $_ }
          $credentials = $maskedCredentials | ConvertTo-Json
          pwsh -command "azd auth login --client-id $AZURE_CLIENT_ID --client-secret $($credentials | ConvertFrom-Json).client_secret --tenant-id $AZURE_TENANT_ID"

      - name: Provision Infrastructure
        run: |
          azd provision --no-prompt --environment-name $AZURE_ENV_NAME --location $AZURE_LOCATION --subscription-id $AZURE_SUBSCRIPTION_ID --initial-environment-config $AZD_INITIAL_ENVIRONMENT_CONFIG

      - name: Deploy Application
        run: |
          azd deploy --no-prompt --environment-name $AZURE_ENV_NAME --location $AZURE_LOCATION --subscription-id $AZURE_SUBSCRIPTION_ID
