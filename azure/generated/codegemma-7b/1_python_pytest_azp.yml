trigger:
  branches:
    include:
      - main

variables:
  pythonVersion: '3.11'

jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest

    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(pythonVersion)

      - script: |
          pip install --upgrade pip
          pip install -r requirements.txt
        displayName: Install dependencies

      - script: |
          pytest -q
        displayName: Run tests
