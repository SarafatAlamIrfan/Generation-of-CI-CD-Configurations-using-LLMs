name: Azure Todo Deployment

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Log in with Azure (Federated Credentials)
        if: ${{ !empty(env.AZURE_CLIENT_ID) }}
        run: |
          azd auth login --client-id ${{ env.AZURE_CLIENT_ID }} --federated-credential-provider "github" --tenant ${{ env.AZURE_TENANT_ID }}

      - name: Log in with Azure (Client Credentials)
        if: ${{ !empty(env.AZURE_CREDENTIALS) }}
        run: |
          azd auth login --client-id ${{ json.parse(env.AZURE_CREDENTIALS).clientId }} --client-secret ${{ json.parse(env.AZURE_CREDENTIALS).clientSecret }} --tenant ${{ env.AZURE_TENANT_ID }}

      - name: Provision Infrastructure
        run: |
          azd provision --no-prompt --environment-name ${{ vars.AZURE_ENV_NAME }} --location ${{ vars.AZURE_LOCATION }} --subscription-id ${{ vars.AZURE_SUBSCRIPTION_ID }} --initial-environment-config ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}

      - name: Deploy Application
        run: |
          azd deploy --no-prompt --environment-name ${{ vars.AZURE_ENV_NAME }} --location ${{ vars.AZURE_LOCATION }} --subscription-id ${{ vars.AZURE_SUBSCRIPTION_ID }}
