trigger:
  branches:
    include:
    - main

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '10.x'

- script: |
  npm install
  npm run build
  npm test
  displayName: 'npm install and build'

- task: PublishTestResults@2
  displayName: 'npm install and build'
  inputs:
    testResultsFiles: '**/*-TEST-*.xml'
