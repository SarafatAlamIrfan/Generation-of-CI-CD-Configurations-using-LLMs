name: Deploy to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Install Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Log in with Azure (Federated Credentials)
        if: env.AZURE_CLIENT_ID != ''
        run: |
          pwsh -c "$env:AZURE_CLIENT_ID; $env:AZURE_TENANT_ID; azd auth login --federated-credential-provider github"
        shell: pwsh

      - name: Log in with Azure (Client Credentials)
        if: env.AZURE_CREDENTIALS != ''
        run: |
          pwsh -c '{
            $credentials = ConvertFrom-Json -InputObject $env:AZURE_CREDENTIALS
            $clientId = $credentials.clientId
            $clientSecret = $credentials.clientSecret
            $tenantId = $credentials.tenantId
            Write-Host "Client ID: ***"
            Write-Host "Client Secret: ***"
            Write-Host "Tenant ID: $tenantId"
            azd auth login --client-id $clientId --client-secret $clientSecret --tenant-id $tenantId
          }'
        shell: pwsh

      - name: Provision Infrastructure
        run: azd provision --no-prompt ${{ env.AZURE_ENV_NAME }} ${{ env.AZURE_LOCATION }} ${{ env.AZURE_SUBSCRIPTION_ID }} --environment-config-file ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Application
        run: azd deploy --no-prompt ${{ env.AZURE_ENV_NAME }} ${{ env.AZURE_LOCATION }} ${{ env.AZURE_SUBSCRIPTION_ID }}
        env:
          AZURE_ENV_NAME: ${{ env.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ env.AZURE_SUBSCRIPTION_ID }}
